[build]
  command = "pnpm install --frozen-lockfile && pnpm --filter web build"
  publish = "apps/web/dist/client"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "10"
  # Public values that naturally appear in source/docs (site URLs, OAuth client ID,
  # contact email, DB URL). Real secrets (auth tokens, signing keys) are still scanned.
  SECRETS_SCAN_OMIT_KEYS = "BETTER_AUTH_URL,WEB_ORIGIN,GOOGLE_CLIENT_ID,PUSH_SUBJECT,DATABASE_URL"

[functions]
  directory = "apps/web/netlify/functions"
  node_bundler = "esbuild"

# Path matching is declared in the function file itself via config.path / excludedPath
# (Netlify Functions v2). Static files in publish dir are served as-is.

# Daily expiry notifier cron (09:00 UTC = 12:00 İstanbul)
[functions."expiry-cron"]
  schedule = "0 9 * * *"
