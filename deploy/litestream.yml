# Continuous replication of the SQLite database to S3-compatible storage.
# Cloudflare R2, Backblaze B2, or self-hosted MinIO all work — fill in the endpoint and bucket in deploy/.env.

dbs:
  - path: /data/medmanager.db
    replicas:
      - type: s3
        endpoint: ${S3_ENDPOINT}      # e.g. https://<account>.r2.cloudflarestorage.com
        bucket: ${S3_BUCKET}          # e.g. medmanager-backups
        path: sqlite
        region: ${S3_REGION:-auto}
        force-path-style: true
        retention: 168h               # keep 7 days of snapshots
        snapshot-interval: 24h
