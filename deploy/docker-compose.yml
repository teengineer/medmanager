name: medmanager

services:
  api:
    image: ghcr.io/${GITHUB_OWNER:-youruser}/medmanager-api:${API_TAG:-latest}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Data Source=/data/medmanager.db
      Jwt__Issuer: ${JWT_ISSUER:-medmanager}
      Jwt__Audience: ${JWT_AUDIENCE:-medmanager-web}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Cors__Origins__0: ${WEB_ORIGIN:-https://medmanager.example.com}
    volumes:
      - sqlite-data:/data
    networks: [web]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      API_DOMAIN: ${API_DOMAIN}
    depends_on: [api]
    networks: [web]

  litestream:
    image: litestream/litestream:latest
    restart: unless-stopped
    command: replicate
    volumes:
      - sqlite-data:/data
      - ./litestream.yml:/etc/litestream.yml:ro
    environment:
      LITESTREAM_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      LITESTREAM_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    depends_on: [api]

volumes:
  sqlite-data:
  caddy-data:
  caddy-config:

networks:
  web:
