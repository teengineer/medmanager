name: medmanager

services:
  api:
    image: ghcr.io/${GITHUB_OWNER:-teengineer}/medmanager-api:${API_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "8080"
      DATABASE_URL: file:/data/medmanager.db
      JWT_ISSUER: ${JWT_ISSUER:-medmanager}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-medmanager-web}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
      JWT_ACCESS_MINUTES: ${JWT_ACCESS_MINUTES:-15}
      JWT_REFRESH_DAYS: ${JWT_REFRESH_DAYS:-7}
      CORS_ORIGINS: ${WEB_ORIGIN:-https://medmanager.example.com}
      PUSH_SUBJECT: ${PUSH_SUBJECT:-mailto:admin@medmanager.local}
      PUSH_PUBLIC_KEY: ${PUSH_PUBLIC_KEY:-}
      PUSH_PRIVATE_KEY: ${PUSH_PRIVATE_KEY:-}
    volumes:
      - sqlite-data:/data
    networks: [web]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      API_DOMAIN: ${API_DOMAIN}
    depends_on: [api]
    networks: [web]

  litestream:
    image: litestream/litestream:latest
    restart: unless-stopped
    command: replicate
    volumes:
      - sqlite-data:/data
      - ./litestream.yml:/etc/litestream.yml:ro
    environment:
      LITESTREAM_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      LITESTREAM_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    depends_on: [api]

volumes:
  sqlite-data:
  caddy-data:
  caddy-config:

networks:
  web:
